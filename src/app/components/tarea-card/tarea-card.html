<div class="card shadow-sm h-100">

  <div class="card-body" (click)="abrirDetalle()" style="cursor:pointer;">

    <h5 class="card-title">
      {{ titulo }}
    </h5>

    <p class="text-muted mb-2"> Creador: {{ responsable }} </p>

    <p class="small">Fecha creacion:
      {{ fechaCreacion }}
    </p>

    <p class="small" *ngIf="estado == 3">Fecha fin de la tarea:
      {{ fechaFinTarea }}
    </p>
    
    <span
       class="badge"
      [class.bg-warning]="estado === 0"
      [class.bg-info]="estado === 1"
      [class.bg-success]="estado === 2"
      [class.bg-danger]="estado === 3">

      {{ estado === 0 ? 'Pendiente' : estado === 1 ? 'EnProgreso' : estado === 2 ? 'Completada' : 'Cancelada' }}

    </span>

    <span
       class="badge"
       [class.bg-success]="prioridad === 0"
       [class.bg-danger]="prioridad === 1"
       [class.bg-warning]="prioridad === 2">

      {{ prioridad === 0 ? 'Baja' : prioridad === 1 ? 'Media' : 'Alta' }}
    </span>
  </div>

</div>

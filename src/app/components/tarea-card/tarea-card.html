<div class="card shadow-sm h-100">

  <div class="card-body">

    <h5 class="card-title">
      {{ titulo }}
    </h5>

    <p class="text-muted mb-2">
      {{ nombreUsuario }}
    </p>

    <p class="small">
      {{ fechaCreacion }}
    </p>

    <span
      class="badge"
      [class.bg-success]="estaCompletada"
      [class.bg-warning]="!estaCompletada">

      {{ estaCompletada ? 'Completada' : 'Pendiente' }}

    </span>

  </div>

</div>

<div *ngIf="tarea" class="container mt-4">

  <h2>Detalle de Tarea</h2>

  <div *ngIf="!editando">
    <p><strong>Título:</strong> {{ titulo }}</p>
    <p><strong>Descripción:</strong> {{ descripcion }}</p>

    <button class="btn btn-primary me-2" (click)="activarEdicion()">Editar</button>
    <button class="btn btn-danger" (click)="eliminarTarea()">Eliminar</button>
  </div>

  <div *ngIf="editando">
    <div class="mb-3">
      <label>Título</label>
      <input class="form-control" [(ngModel)]="tarea.titulo">
    </div>

    <div class="mb-3">
      <label>Descripción</label>
      <textarea class="form-control" [(ngModel)]="tarea.descripcion"></textarea>
    </div>

    <button class="btn btn-success me-2" (click)="guardarEdicion()">Guardar</button>
    <button class="btn btn-secondary" (click)="cancelarEdicion()">Cancelar</button>
  </div>

</div>
